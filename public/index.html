<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatConnect</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="splash-body">
  <main class="splash-frame">
    <div class="splash-content">
      <div class="splash-icon">
        <span class="splash-icon-dot"></span>
        <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
          <defs>
            <linearGradient id="bubbleGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6d5efc" />
              <stop offset="100%" stop-color="#3b82f6" />
            </linearGradient>
          </defs>
          <path fill="url(#bubbleGrad)"
            d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2z" />
          <circle cx="9" cy="11" r="1.3" fill="#fff" />
          <circle cx="12.5" cy="11" r="1.3" fill="#fff" />
          <circle cx="16" cy="11" r="1.3" fill="#fff" />
        </svg>
      </div>

      <h1 class="splash-title">Chat<span class="brand-accent">Connect</span></h1>
      <p class="splash-tagline">Secure. Fast. Collaborative.</p>

      <div class="splash-loader"><span></span></div>
    </div>
  </main>

  <script src="/js/session.js"></script>
  <script src="/js/splash.js"></script>
</body>
</html>
