<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome · ChatConnect</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="splash-body">
  <main class="welcome-card">
    <!-- Hero -->
    <div class="welcome-hero">
      <svg class="welcome-hero-bg" viewBox="0 0 360 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="heroSky" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#dfe7f5" />
            <stop offset="100%" stop-color="#c7d0e8" />
          </linearGradient>
          <linearGradient id="heroFloor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#eef1f8" />
            <stop offset="100%" stop-color="#dbe1ee" />
          </linearGradient>
        </defs>
        <rect width="360" height="220" fill="url(#heroSky)" />
        <rect y="150" width="360" height="70" fill="url(#heroFloor)" />
        <!-- window frames -->
        <rect x="18" y="24" width="150" height="96" rx="6" fill="#ffffff" opacity="0.5" />
        <rect x="192" y="24" width="150" height="96" rx="6" fill="#ffffff" opacity="0.5" />
        <line x1="93" y1="24" x2="93" y2="120" stroke="#c0c8dc" stroke-width="2" />
        <line x1="267" y1="24" x2="267" y2="120" stroke="#c0c8dc" stroke-width="2" />
        <!-- people -->
        <g>
          <circle cx="120" cy="120" r="14" fill="#8b93a7" /><rect x="106" y="132" width="28" height="46" rx="12" fill="#6f7890" />
          <circle cx="165" cy="112" r="15" fill="#b5654d" /><rect x="150" y="125" width="30" height="52" rx="13" fill="#9c5842" />
          <circle cx="205" cy="118" r="14" fill="#c9a27a" /><rect x="191" y="130" width="28" height="48" rx="12" fill="#7a6d63" />
          <circle cx="245" cy="114" r="15" fill="#7d6a58" /><rect x="230" y="127" width="30" height="51" rx="13" fill="#4f5a6e" />
        </g>
      </svg>

      <!-- Floating cards -->
      <div class="welcome-chip chip-top">
        <span class="chip-avatar">
          <svg viewBox="0 0 24 24" width="14" height="14"><path fill="#fff" d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>Meeting starting in 5m!</span>
      </div>

      <div class="welcome-chip chip-bottom">
        <span class="chip-file">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#6d5efc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24l-9.2 9.19a1 1 0 0 1-1.41-1.41l8.49-8.49"/></svg>
        </span>
        <span>Project_Final.pdf</span>
      </div>
    </div>

    <!-- Logo -->
    <div class="welcome-logo">
      <span class="welcome-logo-mark">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="#fff" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2z" />
        </svg>
      </span>
      <span class="welcome-logo-name">Chat<span class="brand-accent">Connect</span></span>
    </div>

    <h1 class="welcome-headline">Connect instantly with<br />anyone, <span class="brand-accent">anywhere</span>.</h1>

    <p class="welcome-desc">
      Professional real-time communication for teams and individuals.
      Experience a breezy, distraction-free environment designed for speed.
    </p>

    <a class="btn-primary" href="/login.html#signup">
      Get Started
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>

    <a class="welcome-login-link" href="/login.html">Login</a>

    <div class="welcome-divider"></div>

    <div class="welcome-social">
      <div class="welcome-avatars">
        <span class="avatar av1"></span>
        <span class="avatar av2"></span>
        <span class="avatar av3"></span>
        <span class="avatar av-count">+12k</span>
      </div>
      <p class="welcome-social-text">Joined by <strong>12,000+</strong> teams worldwide</p>
    </div>
  </main>

  <script src="/js/session.js"></script>
  <script src="/js/welcome.js"></script>
</body>
</html>
